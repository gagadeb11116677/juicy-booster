name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install esbuild
        run: npm install -g esbuild

      - name: Run tests
        run: node --test

      - name: Bundle ESM to CJS
        run: npx esbuild index.js --bundle --platform=node --format=cjs --define:import.meta.url='"file:///D:/a/juicy-booster/juicy-booster/dist/bundle.cjs"' --outfile=dist/bundle.cjs

      - name: Generate sea-config.json On-The-Fly
        run: |
          echo '{"main": "dist/bundle.cjs", "output": "sea-prep.blob", "disableSentinel": false}' > sea-config.json

      - name: Generate SEA blob
        run: node --experimental-sea-config sea-config.json

      - name: Compile Executable (Postject Toolchain)
        run: |
          node -e "require('fs').copyFileSync(process.execPath, 'juicy-booster.exe')"
          npx postject juicy-booster.exe NODE_SEA_BLOB sea-prep.blob --sentinel-fuse NODE_SEA_FUSE_fce680ab2cc467b6e072b8b5df1996b2

      - name: Set subsystem GUI
        run: node scripts/set-subsystem-gui.mjs juicy-booster.exe

      - name: Smoke test with Retry Loop
        run: |
          $proc = Start-Process -FilePath ".\juicy-booster.exe" -PassThru -Environment @{"JUICY_NO_WINDOW"="1";"JUICY_NO_OPEN"="1"}
          
          $maxAttempts = 6
          $attempt = 0
          $success = $false
          
          while ($attempt -lt $maxAttempts -and -not $success) {
              $attempt++
              Write-Host "Mencoba mengecek kesehatan server (Percobaan $attempt dari $maxAttempts)..."
              Start-Sleep -Seconds 5
              try {
                  $health = Invoke-WebRequest -Uri "http://127.0.0" -UseBasicParsing -TimeoutSec 5
                  if ($health.StatusCode -eq 200) {
                      $success = $true
                      Write-Host "Server merespons dengan sukses!"
                  }
              } catch {
                  Write-Host "Server belum siap: $_"
              }
          }
          
          Stop-Process -Id $proc.Id -Force
          if (-not $success) { exit 1 }

      - name: Generate SHA256
        run: |
          $hash = Get-FileHash juicy-booster.exe -Algorithm SHA256
          "$($hash.Hash)  juicy-booster.exe" | Out-File -Encoding ASCII SHA256SUMS.txt

      - name: Upload release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            juicy-booster.exe
            SHA256SUMS.txt

      - name: Upload artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: juicy-booster-exe
          path: juicy-booster.exe
