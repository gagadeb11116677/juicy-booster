name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install esbuild
        run: npm install -g esbuild

      - name: Run tests
        run: node --test

      - name: Generate SEA config
        run: node scripts/gen-sea-config.mjs

      - name: Bundle ESM to CJS
        run: npx esbuild index.js --bundle --platform=node --format=cjs --define:import.meta.url='"file:///sea"' --outfile=dist/bundle.cjs

      - name: Generate Executable and Inject Blob (Native Node 22)
        run: |
          node --experimental-sea-config sea-config.json
          if (Test-Path "dist\juicy-booster.exe") { copy dist\juicy-booster.exe .\juicy-booster.exe }

      - name: Set subsystem GUI
        run: node scripts/set-subsystem-gui.mjs

      - name: Smoke test
        run: |
          $proc = Start-Process -FilePath ".\juicy-booster.exe" -PassThru -Environment @{"JUICY_NO_WINDOW"="1";"JUICY_NO_OPEN"="1"}
          Start-Sleep -Seconds 5
          $health = Invoke-WebRequest -Uri "http://127.0.0" -UseBasicParsing
          if ($health.StatusCode -ne 200) { exit 1 }
          Stop-Process -Id $proc.Id -Force

      - name: Generate SHA256
        run: |
          $hash = Get-FileHash juicy-booster.exe -Algorithm SHA256
          "$($hash.Hash)  juicy-booster.exe" | Out-File -Encoding ASCII SHA256SUMS.txt

      - name: Upload release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            juicy-booster.exe
            SHA256SUMS.txt

      - name: Upload artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: juicy-booster-exe
          path: juicy-booster.exe
